<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autosähköapu AI – ylläpito</title><link rel="stylesheet" href="style.css"><style>main{max-width:720px;margin:60px auto;padding:20px}.admin-card{border:1px solid var(--line);background:var(--surface);padding:24px;border-radius:20px}.admin-card label{display:block;margin:14px 0}.admin-card input,.admin-card select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#090d12;color:#fff}.codeout{font:700 1.4rem ui-monospace,monospace;padding:16px;border:1px dashed var(--accent);border-radius:12px;margin-top:16px;word-break:break-all}</style></head><body><main><div class="admin-card"><p class="eyebrow">Ylläpito</p><h1>Luo aktivointikoodi</h1><p>Tätä sivua ei tarvitse linkittää julkiselta sivulta. Admin-salaisuus lähetetään vain Workerille eikä sitä tallenneta.</p><label>Worker URL<input id="worker" placeholder="https://autosahkoapu-ai....workers.dev"></label><label>Admin secret<input id="secret" type="password"></label><label>Paketti<select id="plan"><option value="single">1 diagnoosi · 30 vaihetta</option><option value="five">5 diagnoosia · 150 vaihetta</option><option value="month">30 päivää · 300 vaihetta</option></select></label><label>Muistiinpano<input id="note" placeholder="Esim. EezyPay 17.9. / asiakas"></label><button id="create" class="button button-primary">Luo koodi</button><div id="out"></div></div></main><script>document.getElementById('create').onclick=async()=>{const out=document.getElementById('out');out.textContent='Luodaan…';try{const u=document.getElementById('worker').value.replace(/\/$/,'');const r=await fetch(u+'/admin/create-code',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+document.getElementById('secret').value},body:JSON.stringify({plan:document.getElementById('plan').value,note:document.getElementById('note').value})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Virhe');out.innerHTML='<div class="codeout">'+x.code+'</div><p>'+x.remainingText+'</p>';}catch(e){out.textContent=e.message;}};</script></body></html>
