name = "autosahkoapu-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

# Lisää Cloudflare Dashboardissa / wranglerilla:
# OPENAI_API_KEY (secret)
# ADMIN_SECRET (secret)
# ALLOWED_ORIGIN = "https://autosahkoapu.fi"
# OPENAI_MODEL = "gpt-5.6-luna"

# KV aktivointikoodeille. Luo namespace ja korvaa id.
[[kv_namespaces]]
binding = "ACCESS_CODES"
id = "VAIHDA_KV_NAMESPACE_ID"

# D1: tähän tuodaan Autodiag2:n virallinen ad_database.sqlite -> SQL dump.
[[d1_databases]]
binding = "AUTODIAG_DB"
database_name = "autosahkoapu-autodiag"
database_id = "VAIHDA_D1_DATABASE_ID"

# Valinnainen toinen D1 Wal33D:n valmistajakohtaisille DTC-koodeille.
# Worker toimii ilman tätäkin OBDex + OBDb + Autodiag2 -lähteillä.
# [[d1_databases]]
# binding = "OPEN_DTC_DB"
# database_name = "autosahkoapu-open-dtc"
# database_id = "VAIHDA_TOISEN_D1_TIETOKANNAN_ID"
