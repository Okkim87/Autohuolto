<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="title desc">
  <title id="title">12 V akun jännitemittaus yleismittarilla</title>
  <desc id="desc">Mittari on tasajännitemittauksessa V DC. Punainen johto on V-liitännässä ja akun plusnavassa. Musta johto on COM-liitännässä ja akun miinusnavassa. Akun omat kaapelit jäävät paikalleen.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#e6edf6;font-size:20px}.small{font-size:17px;fill:#aebed0}.label{font-weight:700}.wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="800" height="640" rx="22" fill="#0b121b"/>
  <text x="30" y="43" class="label" font-size="25">Akun jännite: mittari akun napojen väliin</text>
  <text x="30" y="74" class="small">12 V järjestelmä · akun omat kaapelit pysyvät paikallaan</text>
  <rect x="230" y="145" width="340" height="150" rx="16" fill="#1a293a" stroke="#6a809b" stroke-width="2"/>
  <rect x="271" y="133" width="28" height="20" rx="3" fill="#d4dfeb"/>
  <rect x="501" y="133" width="28" height="20" rx="3" fill="#f06a66"/>
  <text x="285" y="182" text-anchor="middle" class="label">−</text>
  <text x="515" y="182" text-anchor="middle" class="label">+</text>
  <text x="400" y="242" text-anchor="middle" class="label">12 V AKKU</text>
  <path d="M285 145H170V468H350" class="wire" stroke="#d4dfeb"/>
  <path d="M515 145H630V468H450" class="wire" stroke="#f06a66"/>
  <text x="170" y="326" text-anchor="middle" class="small">Musta johto</text>
  <text x="630" y="326" text-anchor="middle" class="small">Punainen johto</text>
  <rect x="340" y="315" width="120" height="185" rx="18" fill="#e5ac42"/>
  <rect x="352" y="333" width="96" height="44" rx="6" fill="#172535"/>
  <text x="400" y="363" text-anchor="middle" class="label">V DC</text>
  <circle cx="400" cy="415" r="22" fill="#172535"/>
  <path d="M400 415L412 400" stroke="#e6edf6" stroke-width="4"/>
  <circle cx="350" cy="468" r="9" fill="#111" stroke="#d4dfeb" stroke-width="2"/>
  <circle cx="450" cy="468" r="9" fill="#c53431" stroke="#f5d6d4" stroke-width="2"/>
  <text x="350" y="528" text-anchor="middle" class="label">COM</text>
  <text x="450" y="528" text-anchor="middle" class="label">V / Ω</text>
  <rect x="24" y="557" width="752" height="61" rx="12" fill="#382019" stroke="#f78a58"/>
  <text x="42" y="583" class="label">Punainen johto V-liitäntään, ei A-liitäntään.</text>
  <text x="42" y="605" class="small">Vältä napojen oikosulkua. Noudata oman mittarin käyttöohjetta.</text>
</svg>
